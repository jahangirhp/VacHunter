name: backend-tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
        env:
          TEST_MONGO_URI: mongodb://localhost:27017
