[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "dutch-job-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pymongo>=4.11,<5", "beautifulsoup4>=4.12,<5", "pydantic-settings>=2.6,<3", "langdetect>=1.0.9,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "mongomock>=4.3,<5"]
[project.scripts]
jobintel = "jobintel.cli:main"
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools.packages.find]
include = ["jobintel*"]
